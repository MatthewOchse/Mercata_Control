# Per-host MySQL for a Mercata application box (Caesar-style).
#
# Tenant containers use MYSQL_HOST=host.docker.internal → this published port.
# The provision worker on the host uses Server.db_host/db_port (127.0.0.1:3306).
#
#   cp deploy/host-mysql.env.example deploy/host-mysql.env
#   docker compose -f deploy/host-mysql.compose.yml --env-file deploy/host-mysql.env up -d
#
# Do not publish 3306 on the public internet in production — prefer
# "127.0.0.1:3306:3306" (default below). Tailscale access is enough for ops.

services:
  mysql:
    image: mysql:8.4
    container_name: mercata-host-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in host-mysql.env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-platform}
    volumes:
      - mercata_host_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mercata_host_mysql_data:
